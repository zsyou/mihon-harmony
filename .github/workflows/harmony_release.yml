name: Harmony Release

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official Mihon tag; leave empty to use the latest stable release'
        required: false
        type: string
      patch_number:
        description: 'Harmony patch number'
        required: true
        default: '1'
        type: string
      dry_run:
        description: 'Validate patches and the version bump, then stop before signing or publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: harmony-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  MIHON_GITHUB_RELEASE: true
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Checkout fork history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Test Harmony prepare script
        run: python3 .github/scripts/test_prepare_harmony_tree.py

      - name: Resolve release version
        id: version
        env:
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_PATCH_NUMBER: ${{ inputs.patch_number }}
        run: |
          set -euo pipefail

          upstream_tag="${INPUT_UPSTREAM_TAG:-}"
          patch_number="${INPUT_PATCH_NUMBER:-1}"

          if [[ -z "$upstream_tag" ]]; then
            upstream_tag="$(gh api repos/mihonapp/mihon/releases/latest --jq '.tag_name')"
          fi

          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported upstream tag: $upstream_tag" >&2
            echo "Use a stable Mihon tag such as v0.21.2. See .github/HARMONY_RELEASE.md." >&2
            exit 1
          fi
          if [[ ! "$patch_number" =~ ^[1-9][0-9]?$ ]]; then
            echo "Patch number must be between 1 and 99, got: $patch_number" >&2
            exit 1
          fi

          release_tag="${upstream_tag}-harmony.${patch_number}"
          echo "Resolved $release_tag from upstream $upstream_tag"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "patch_number=$patch_number" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Skip an existing release
        id: existing
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: existing releases are not skipped."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate signing secrets
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SIGNING_KEY" ]] || missing+=("SIGNING_KEY (Base64-encoded keystore file)")
          [[ -n "$KEY_STORE_PASSWORD" ]] || missing+=("KEY_STORE_PASSWORD")
          [[ -n "$ALIAS" ]] || missing+=("ALIAS")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("KEY_PASSWORD")
          if ((${#missing[@]})); then
            echo "Harmony Release cannot sign APKs. Add these Actions secrets:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Setup steps are in .github/HARMONY_RELEASE.md. No tag or release was created." >&2
            exit 1
          fi

      - name: Prepare official source with Harmony patches
        if: steps.existing.outputs.skip != 'true'
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          PATCH_NUMBER: ${{ steps.version.outputs.patch_number }}
        run: |
          set -euo pipefail
          args=(--upstream-tag "$UPSTREAM_TAG" --patch-number "$PATCH_NUMBER")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--check)
          else
            args+=(--apply)
          fi
          python3 .github/scripts/prepare_harmony_tree.py "${args[@]}"

      - name: Set up JDK
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Decode signing keystore
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true'
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/antsy.keystore"
          if ! printf '%s' "$SIGNING_KEY" | base64 -d > "$keystore"; then
            echo "SIGNING_KEY is not valid Base64. Store the Base64 encoding of the keystore file, not the password." >&2
            echo "See .github/HARMONY_RELEASE.md." >&2
            exit 1
          fi
          if [[ ! -s "$keystore" ]]; then
            echo "Decoded signing keystore is empty." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" </dev/null >/tmp/keytool.out 2>&1; then
            echo "Could not open the signing keystore with KEY_STORE_PASSWORD and ALIAS." >&2
            cat /tmp/keytool.out >&2
            exit 1
          fi
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - name: Check, test, and build signed APKs
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          # Current Mihon reads storeFile. Older tags read storeFileBase64. Provide both.
          storeFile: ${{ steps.signing.outputs.keystore }}
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [[ ! -s "${storeFile}" ]]; then
            echo "storeFile is missing: ${storeFile}" >&2
            exit 1
          fi
          if ! ./gradlew spotlessCheck testDebugUnitTest assembleRelease; then
            echo "Gradle failed on the Harmony-patched ${UPSTREAM_TAG} tree." >&2
            echo "Patch conflicts are reported before this step. A compile or spotless failure in Downloader.kt or UniFileExtensions.kt means the Harmony patch needs a refresh. See .github/HARMONY_RELEASE.md." >&2
            exit 1
          fi

      - name: Sign APKs for legacy Mihon releases
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true' && hashFiles('app/build/outputs/apk/release/*-unsigned.apk') != ''
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Prepare release files
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir release-files

          copy_release_apk() {
            local abi="$1"
            local destination="$2"
            local release_dir="app/build/outputs/apk/release"
            local apk="$release_dir/app-${abi}-release.apk"
            local legacy_apk="$release_dir/app-${abi}-release-unsigned-signed.apk"

            if [[ -f "$apk" ]]; then
              cp "$apk" "$destination"
            elif [[ -f "$legacy_apk" ]]; then
              cp "$legacy_apk" "$destination"
            else
              echo "Unable to find a signed $abi APK in $release_dir" >&2
              find "$release_dir" -maxdepth 1 -type f -print >&2
              exit 1
            fi
          }

          copy_release_apk universal "release-files/mihon-${RELEASE_TAG}-universal.apk"
          copy_release_apk arm64-v8a "release-files/mihon-${RELEASE_TAG}-arm64-v8a.apk"

      - name: Push tag and create GitHub release
        if: steps.existing.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" -m "Mihon Harmony $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          gh release create "$RELEASE_TAG" \
            release-files/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mihon Harmony $RELEASE_TAG" \
            --notes "Unofficial HarmonyOS/ZhuoyiTong compatibility build based on Mihon $UPSTREAM_TAG."
